services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-vendas_api}
    restart: unless-stopped
    ports:
      - '${APP_PORT:-5000}:5000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DATABASE_URL: 'mysql://${DB_USER:-root}:${DB_PASSWORD:-root}@${DB_HOST:-db}:${DB_PORT:-3306}/${DB_NAME:-vendas}'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-vendas_api}-migrate
    restart: 'no'
    environment:
      DATABASE_URL: 'mysql://${DB_USER:-root}:${DB_PASSWORD:-root}@${DB_HOST:-db}:${DB_PORT:-3306}/${DB_NAME:-vendas}'
    depends_on:
      db:
        condition: service_healthy
    command: ['npx', 'prisma', 'migrate', 'deploy']

  db:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    container_name: ${APP_NAME:-vendas_api}_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-vendas}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - ${DB_VOLUME:-mariadb_data}:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD} --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mariadb_data:
    name: ${DB_VOLUME:-mariadb_data}
