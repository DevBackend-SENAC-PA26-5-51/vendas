services:
  app:
    image: gabrielpccosta/api-vendas:1.0.1-beta
    container_name: ${APP_NAME:-vendas_api}
    restart: unless-stopped
    ports:
      - '${APP_PORT:-5000}:5000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    image: gabrielpccosta/api-vendas:1.0.1-beta
    container_name: ${APP_NAME:-vendas_api}-migrate
    restart: 'no'
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        npx prisma migrate deploy || {
          echo "Aviso: Migração falhou. Continuando..."
          exit 0
        }

  seed:
    image: gabrielpccosta/api-vendas:1.0.1-beta
    container_name: ${APP_NAME:-vendas_api}-seed
    restart: 'no'
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        npx tsx prisma/seed.ts || {
          echo "Aviso: Seed falhou. Continuando..."
          exit 0
        }

  db:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    container_name: ${APP_NAME:-vendas_api}_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-vendas}
      MARIADB_USER: ${DB_USER:-vendas}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente}
    ports:
      - '${DB_PORT:-3306}:${DB_INTERNAL_PORT:-3306}'
    volumes:
      - ${DB_VOLUME:-mariadb_data}:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD} --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mariadb_data:
    name: ${DB_VOLUME:-mariadb_data}
