name: CI-CD Docker API Vendas

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  docker:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Obter o código do repositório
      - name: Checkout
        uses: actions/checkout@v6

      # 2. Configurar metadados e tags
      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: gabrielpccosta/api-vendas
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 3. Autenticar no Docker Hub
      - name: Login Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Configurar Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 5. Construir e publicar a imagem
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
